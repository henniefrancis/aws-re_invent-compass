# End-to-end browser tests (S0 workflow, made real by S7).
#
# Triggered only on demand (workflow_dispatch). It is never run on push, pull request or a
# schedule. It builds the site and runs Playwright with axe on all seven device profiles
# (desktop Chromium, Firefox and WebKit, iPad and iPhone in both orientations) against the
# local static server of the site workspace, then uploads the HTML report as an artifact.
# Every action is pinned by commit SHA.
#
# This file contains no em dash or en dash.
name: e2e

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: playwright and axe
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b

      - name: Build the site
        run: npm run build:site

      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit firefox

      - name: Run end-to-end tests
        run: npm run e2e

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: site/playwright-report
          if-no-files-found: error
          retention-days: 14
