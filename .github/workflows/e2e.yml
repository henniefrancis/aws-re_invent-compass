# End-to-end browser tests (foundation-contracts, S0).
#
# Triggered only on demand (workflow_dispatch). It is never run on push, pull
# request or a schedule. Playwright across the device profiles, plus axe and
# Lighthouse, is wired up by S7 when the site exists; for now the job installs and
# runs whatever Playwright config is present, and is a no-op when none exists.
# Every action is pinned by commit SHA.
#
# This file contains no em dash or en dash.
name: e2e

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: playwright, axe and lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run end-to-end tests
        run: npm run e2e --if-present
