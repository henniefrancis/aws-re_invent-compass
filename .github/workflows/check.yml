# Required check workflow (foundation-contracts, S0).
#
# One job, triggered only on a pull request into main (build plan 11.1 and the
# design). There is no push trigger and no schedule trigger anywhere. Every action
# is pinned by commit SHA. The steps run in the build plan 11.1 order. The
# Terraform and shellcheck steps are guarded by a presence check so they pass as
# no-ops while the repository has no Terraform or shell files yet.
#
# This file contains no em dash or en dash.
name: check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: build, test and scan
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so gitleaks can scan every commit on the pull request, and
          # never persist the token in the local git config.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Contract hash check
        run: npm run check:hash

      - name: Placeholder safety check
        run: npm run check:placeholders

      - name: Dash check
        run: npm run check:dash

      - name: Catalog check
        run: npm run check:catalog

      - name: Prettier
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: TypeScript build
        run: npx tsc -b

      - name: Unit tests with coverage
        run: npm test

      - name: Build
        run: npm run build --if-present

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: npm audit with a reviewed allowlist
        run: node .github/scripts/audit-check.mjs

      # Terraform steps run only when Terraform files exist. While there are none
      # (S6 adds them later) these steps pass as no-ops.
      - name: Detect Terraform files
        id: tf
        shell: bash
        run: |
          if [ -n "$(git ls-files '*.tf')" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Terraform
        if: steps.tf.outputs.present == 'true'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Terraform fmt
        if: steps.tf.outputs.present == 'true'
        run: terraform fmt -check -recursive

      - name: Terraform validate
        if: steps.tf.outputs.present == 'true'
        run: |
          for dir in $(git ls-files '*.tf' | xargs -n1 dirname | sort -u); do
            terraform -chdir="$dir" init -backend=false
            terraform -chdir="$dir" validate
          done

      - name: Set up tflint
        if: steps.tf.outputs.present == 'true'
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2

      - name: tflint
        if: steps.tf.outputs.present == 'true'
        run: tflint --recursive

      - name: Terraform test
        if: steps.tf.outputs.present == 'true'
        run: |
          for dir in $(git ls-files '*.tftest.hcl' | xargs -n1 dirname | sort -u); do
            terraform -chdir="$dir" test
          done

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          exit-code: 1
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          exit-code: 1
          severity: HIGH,CRITICAL

      # Shellcheck runs only when shell files exist. While there are none these
      # steps pass as no-ops.
      - name: Detect shell files
        id: sh
        shell: bash
        run: |
          if [ -n "$(git ls-files '*.sh')" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Shellcheck
        if: steps.sh.outputs.present == 'true'
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
