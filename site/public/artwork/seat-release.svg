<svg xmlns="http://www.w3.org/2000/svg" width="480" height="140" viewBox="0 0 480 140" role="img">
  <title>Seat released at 10:20, session starts at 10:30</title>
  <rect width="480" height="140" fill="#15173a" />
  <line x1="40" y1="70" x2="440" y2="70" stroke="#8f93c9" stroke-width="4" />
  <line x1="40" y1="70" x2="300" y2="70" stroke="#f09740" stroke-width="8" stroke-linecap="round" />
  <circle cx="300" cy="70" r="12" fill="#f09740" />
  <circle cx="400" cy="70" r="12" fill="#15173a" stroke="#ffffff" stroke-width="4" />
  <text x="300" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Seat released</text>
  <text x="300" y="110" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f09740">10:20</text>
  <text x="400" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Starts</text>
  <text x="400" y="110" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#ffffff">10:30</text>
  <text x="170" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#c8cae8">your walk</text>
</svg>
