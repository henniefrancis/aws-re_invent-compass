<header class="site-header">
  <div class="container site-header__bar">
    <a class="brand-link" routerLink="/"
      ><img class="brand-logo" src="artwork/logo.svg" width="129" height="56" [alt]="productName"
    /></a>
    <nav aria-label="Main">
      <ul class="site-nav">
        @for (item of items; track item.path) {
          <li>
            <a
              [routerLink]="item.path"
              routerLinkActive
              ariaCurrentWhenActive="page"
              [routerLinkActiveOptions]="item.path === '/' ? exactHome : partial"
              >{{ item.label }}</a
            >
          </li>
        }
      </ul>
    </nav>
  </div>
</header>
