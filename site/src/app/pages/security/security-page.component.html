<h1 tabindex="-1">{{ title }}</h1>
@for (block of blocks; track block.id; let first = $first) {
  <p [class.lead]="first">{{ block.text }}</p>
}
<ul>
  <li><a [href]="report" rel="noopener noreferrer">Report a vulnerability privately</a></li>
  <li>
    <a [href]="policy" target="_blank" rel="noopener noreferrer"
      >The full security policy (SECURITY.md)<span class="visually-hidden">
        (opens in a new tab)</span
      ></a
    >
  </li>
</ul>
