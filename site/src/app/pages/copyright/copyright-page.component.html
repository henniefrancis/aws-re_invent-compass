<h1 tabindex="-1">{{ title }}</h1>
<p class="lead">
  <strong>{{ line }}</strong>
</p>
@for (block of blocks; track block.id) {
  <p>{{ block.text }}</p>
}
<ul>
  @for (file of files; track file.href) {
    <li>
      <a [href]="file.href" target="_blank" rel="noopener noreferrer"
        >{{ file.label }}<span class="visually-hidden"> (opens in a new tab)</span></a
      >
    </li>
  }
</ul>
