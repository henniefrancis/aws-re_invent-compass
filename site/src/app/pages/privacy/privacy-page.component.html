<h1 tabindex="-1">Privacy: what leaves your machine</h1>
<p class="measure">{{ intro }}</p>

@for (section of sections; track section.id) {
  <section class="stack measure" [attr.aria-labelledby]="'privacy-' + section.id">
    <h2 [id]="'privacy-' + section.id">{{ section.heading }}</h2>
    <ul>
      @for (item of section.items; track item.id) {
        <li>{{ item.text }}</li>
      }
    </ul>
  </section>
}

<section class="stack measure" aria-labelledby="privacy-contact">
  <h2 id="privacy-contact">Questions</h2>
  <p>
    Open an issue in the <a [href]="repository" rel="noopener noreferrer">project repository</a>.
  </p>
</section>
